<svg id="now-svg" xmlns="http://www.w3.org/2000/svg" width="720" height="44" viewBox="0 0 720 44" role="img" aria-labelledby="now-title now-desc">
  <title id="now-title">Current thoughts — ZengLLQ</title>
  <desc id="now-desc">Animated terminal prompt strip cycling through three taglines in ZengLLQ's purple theme.</desc>
  <defs>
    <linearGradient id="now-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#131022"/>
      <stop offset="100%" stop-color="#211b38"/>
    </linearGradient>
    <style>
      #now-svg .mono { font-family: ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace; }
    </style>
  </defs>

  <rect x="0.5" y="0.5" width="719" height="43" rx="6" fill="url(#now-bg)" stroke="#322b4f" stroke-width="1"/>

  <text x="16" y="27" class="mono" font-size="14" fill="#bd93f9" opacity="0.8">&gt;</text>

  <text x="34" y="27" class="mono" font-size="12.5" fill="#e9e4ff" opacity="1">making room for curiosity, wonder, and whatever comes next<animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.24;0.28;0.96;1" dur="12s" repeatCount="indefinite"/></text>
  <text x="34" y="27" class="mono" font-size="12.5" fill="#e9e4ff" opacity="0">even code needs a little logic, pixie dust, and imagination<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.30;0.34;0.58;0.62;1" dur="12s" repeatCount="indefinite"/></text>
  <text x="34" y="27" class="mono" font-size="12.5" fill="#e9e4ff" opacity="0">exploring AI &amp; ML, far-off places, and stories still unfolding<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.64;0.68;0.91;0.95;1" dur="12s" repeatCount="indefinite"/></text>

  <rect x="694" y="14" width="8" height="16" rx="1" fill="#bd93f9">
    <animate attributeName="opacity" values="1;0" keyTimes="0;0.5" calcMode="discrete" dur="1.05s" repeatCount="indefinite"/>
  </rect>
</svg>
