<svg id="frameworks-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1012 146" width="1012" height="146" role="img" aria-labelledby="frameworks-title frameworks-desc">
  <title id="frameworks-title">ZengLLQ — Frameworks, SDKs &amp; Engines: Fullstack &amp; Reactive UI, Back-End &amp; ORM, AI &amp; Agentic, Desktop GUI &amp; 3D Engine</title>
  <desc id="frameworks-desc">Animated purple-themed architectural overview of ZengLLQ's eight framework, SDK, and real-time engine layers across Web &amp; Fullstack, Reactive UI, Styling, Back-End &amp; API, ORM, AI &amp; Agentic, Desktop GUI, and 3D Engines.</desc>
  <defs>
    <linearGradient id="frameworks-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#131022"/>
      <stop offset="55%" stop-color="#1c1733"/>
      <stop offset="100%" stop-color="#25203d"/>
    </linearGradient>
    <radialGradient id="frameworks-ambient" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0%" stop-color="#bd93f9" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#bd93f9" stop-opacity="0"/>
    </radialGradient>
    <style>
      #frameworks-svg text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
      #frameworks-svg .mono { font-family: ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace; }
    </style>
  </defs>

  <!-- outer card frame & ambient glow -->
  <rect x="0.5" y="0.5" width="1011" height="145" rx="8" fill="url(#frameworks-bg)" stroke="#322b4f" stroke-width="1"/>
  <rect x="1" y="1" width="1010" height="144" rx="7.5" fill="url(#frameworks-ambient)"/>

  <!-- top architectural header bar -->
  <line x1="1" y1="32.5" x2="1011" y2="32.5" stroke="#322b4f" stroke-width="1"/>

  <!-- vector 4-point star icon (avoids Unicode font fallback shifts) -->
  <path d="M22 11.5 L23.3 15.2 L27 16.5 L23.3 17.8 L22 21.5 L20.7 17.8 L17 16.5 L20.7 15.2 Z" fill="#bd93f9"/>
  <text x="34" y="20" class="mono" font-size="10" letter-spacing="1"><tspan fill="#c4b5fd">FRAMEWORKS, SDKS &amp; ENGINES</tspan><tspan fill="#9489b8">&#160;&#160;//&#160;&#160;8 SPECIALIZED LAYERS</tspan></text>

  <!-- right-aligned meta label + pulsing status indicator anchored at right edge -->
  <text x="980" y="20" text-anchor="end" class="mono" font-size="10" fill="#9489b8" letter-spacing="0.8">zengllq://runtime.mesh</text>
  <circle cx="991" cy="16.5" r="2.8" fill="#bd93f9">
    <animate attributeName="opacity" values="1;0.4;1" keyTimes="0;0.5;1" dur="2.9s" repeatCount="indefinite"/>
  </circle>

  <!-- ==================== 01: FULLSTACK & REACTIVE UI ==================== -->
  <g>
    <rect x="16.5" y="46.5" width="235" height="85" rx="6" fill="#1b1630" stroke="#322b4f" stroke-width="1">
      <animate attributeName="stroke" values="#bd93f9;#bd93f9;#322b4f;#322b4f;#bd93f9" keyTimes="0;0.21;0.25;0.96;1" dur="13.6s" repeatCount="indefinite"/>
    </rect>
    <!-- vector component layout window icon -->
    <g fill="none" stroke="#bd93f9" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="29.5" y="56.5" width="12" height="9" rx="1.5"/>
      <line x1="29.5" y1="59.5" x2="41.5" y2="59.5"/>
      <line x1="33.5" y1="59.5" x2="33.5" y2="65.5"/>
    </g>
    <text x="48" y="64" class="mono" font-size="9" fill="#9489b8" letter-spacing="1">01 // LAYER</text>
    <text x="29" y="83" font-size="13" font-weight="600" fill="#faf5ff">Fullstack &amp; Reactive UI</text>
    <text x="29" y="100" class="mono" font-size="9" fill="#c4b5fd">SSR · Islands · Design Tokens</text>
    <text x="29" y="114" class="mono" font-size="8.5" fill="#9489b8">Next.js · ASP.NET · React · Tailwind</text>
    <rect x="29" y="122" width="210" height="3" rx="1.5" fill="#2b2447"/>
    <rect x="29" y="122" width="28" height="3" rx="1.5" fill="#bd93f9" fill-opacity="0.85">
      <animate attributeName="width" values="28;210;210;28;28" keyTimes="0;0.20;0.25;0.26;1" dur="13.6s" repeatCount="indefinite"/>
      <animate attributeName="fill-opacity" values="0.85;0.85;0;0;0.85" keyTimes="0;0.21;0.25;0.96;1" dur="13.6s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- ==================== 02: BACK-END, API & ORM ==================== -->
  <g>
    <rect x="264.5" y="46.5" width="235" height="85" rx="6" fill="#1b1630" stroke="#322b4f" stroke-width="1">
      <animate attributeName="stroke" values="#322b4f;#322b4f;#bd93f9;#bd93f9;#322b4f;#322b4f" keyTimes="0;0.21;0.25;0.46;0.50;1" dur="13.6s" repeatCount="indefinite"/>
    </rect>
    <!-- vector API routing gateway icon -->
    <g fill="none" stroke="#bd93f9" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="279.5" cy="61" r="2"/>
      <circle cx="288" cy="57.5" r="1.7"/>
      <circle cx="288" cy="64.5" r="1.7"/>
      <line x1="281.4" y1="60.2" x2="286.4" y2="58.2"/>
      <line x1="281.4" y1="61.8" x2="286.4" y2="63.8"/>
    </g>
    <text x="296" y="64" class="mono" font-size="9" fill="#9489b8" letter-spacing="1">02 // LAYER</text>
    <text x="277" y="83" font-size="13" font-weight="600" fill="#faf5ff">Back-End, API &amp; ORM</text>
    <text x="277" y="100" class="mono" font-size="9" fill="#c4b5fd">HTTP Routers · RPC · Data Access</text>
    <text x="277" y="114" class="mono" font-size="8.5" fill="#9489b8">FastAPI · Chi · NestJS · EF Core</text>
    <rect x="277" y="122" width="210" height="3" rx="1.5" fill="#2b2447"/>
    <rect x="277" y="122" width="28" height="3" rx="1.5" fill="#bd93f9" fill-opacity="0">
      <animate attributeName="width" values="28;28;210;210;28;28" keyTimes="0;0.25;0.45;0.50;0.51;1" dur="13.6s" repeatCount="indefinite"/>
      <animate attributeName="fill-opacity" values="0;0;0.85;0.85;0;0" keyTimes="0;0.21;0.25;0.46;0.50;1" dur="13.6s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- ==================== 03: AI & AGENTIC ==================== -->
  <g>
    <rect x="512.5" y="46.5" width="235" height="85" rx="6" fill="#1b1630" stroke="#322b4f" stroke-width="1">
      <animate attributeName="stroke" values="#322b4f;#322b4f;#bd93f9;#bd93f9;#322b4f;#322b4f" keyTimes="0;0.46;0.50;0.71;0.75;1" dur="13.6s" repeatCount="indefinite"/>
    </rect>
    <!-- vector agentic diamond mesh icon -->
    <g fill="none" stroke="#bd93f9" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M531 55.5 L536.5 61 L531 66.5 L525.5 61 Z"/>
      <circle cx="531" cy="61" r="1.4" fill="#c4b5fd" stroke="none"/>
    </g>
    <text x="543" y="64" class="mono" font-size="9" fill="#9489b8" letter-spacing="1">03 // LAYER</text>
    <text x="525" y="83" font-size="13" font-weight="600" fill="#faf5ff">AI &amp; Agentic</text>
    <text x="525" y="100" class="mono" font-size="9" fill="#c4b5fd">Orchestration · Agents · Stream</text>
    <text x="525" y="114" class="mono" font-size="8.5" fill="#9489b8">Vercel AI · LangChain.js · Mastra</text>
    <rect x="525" y="122" width="210" height="3" rx="1.5" fill="#2b2447"/>
    <rect x="525" y="122" width="28" height="3" rx="1.5" fill="#bd93f9" fill-opacity="0">
      <animate attributeName="width" values="28;28;210;210;28;28" keyTimes="0;0.50;0.70;0.75;0.76;1" dur="13.6s" repeatCount="indefinite"/>
      <animate attributeName="fill-opacity" values="0;0;0.85;0.85;0;0" keyTimes="0;0.46;0.50;0.71;0.75;1" dur="13.6s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- ==================== 04: DESKTOP GUI & 3D ENGINE ==================== -->
  <g>
    <rect x="760.5" y="46.5" width="235" height="85" rx="6" fill="#1b1630" stroke="#322b4f" stroke-width="1">
      <animate attributeName="stroke" values="#322b4f;#322b4f;#bd93f9;#bd93f9;#322b4f" keyTimes="0;0.71;0.75;0.96;1" dur="13.6s" repeatCount="indefinite"/>
    </rect>
    <!-- vector isometric 3D cube icon -->
    <g fill="none" stroke="#bd93f9" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M779 55 L784.5 58 L784.5 64 L779 67 L773.5 64 L773.5 58 Z"/>
      <path d="M773.5 58 L779 61 L784.5 58 M779 61 L779 67"/>
    </g>
    <text x="791" y="64" class="mono" font-size="9" fill="#9489b8" letter-spacing="1">04 // LAYER</text>
    <text x="773" y="83" font-size="13" font-weight="600" fill="#faf5ff">Desktop GUI &amp; 3D Engine</text>
    <text x="773" y="100" class="mono" font-size="9" fill="#c4b5fd">Native Shells · Real-Time 3D</text>
    <text x="773" y="114" class="mono" font-size="8.5" fill="#9489b8">Tauri · egui · Tkinter · Unreal</text>
    <rect x="773" y="122" width="210" height="3" rx="1.5" fill="#2b2447"/>
    <rect x="773" y="122" width="28" height="3" rx="1.5" fill="#bd93f9" fill-opacity="0">
      <animate attributeName="width" values="28;28;210;210;28" keyTimes="0;0.75;0.94;0.99;1" dur="13.6s" repeatCount="indefinite"/>
      <animate attributeName="fill-opacity" values="0;0;0.85;0.85;0;0" keyTimes="0;0.71;0.75;0.95;0.99;1" dur="13.6s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
