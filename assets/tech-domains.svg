<svg id="domains-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 146" width="880" height="146" role="img" aria-labelledby="domains-title domains-desc">
  <title id="domains-title">ZengLLQ — Core Project Domains: Blockchain, Cybersecurity, Backend, AI &amp; Machine Learning</title>
  <desc id="domains-desc">Animated purple-themed architectural overview of ZengLLQ's four primary engineering domains: Blockchain, Cybersecurity, Backend, and AI &amp; Machine Learning.</desc>
  <defs>
    <linearGradient id="domains-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#131022"/>
      <stop offset="55%" stop-color="#1c1733"/>
      <stop offset="100%" stop-color="#25203d"/>
    </linearGradient>
    <radialGradient id="domains-ambient" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0%" stop-color="#bd93f9" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#bd93f9" stop-opacity="0"/>
    </radialGradient>
    <style>
      #domains-svg text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
      #domains-svg .mono { font-family: ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace; }
    </style>
  </defs>

  <!-- outer card frame & ambient glow -->
  <rect x="0.5" y="0.5" width="879" height="145" rx="8" fill="url(#domains-bg)" stroke="#322b4f" stroke-width="1"/>
  <rect x="1" y="1" width="878" height="144" rx="7.5" fill="url(#domains-ambient)"/>

  <!-- top architectural header bar -->
  <line x1="1" y1="32.5" x2="879" y2="32.5" stroke="#322b4f" stroke-width="1"/>

  <!-- vector 4-point star icon (avoids Unicode font fallback shifts) -->
  <path d="M22 11.5 L23.3 15.2 L27 16.5 L23.3 17.8 L22 21.5 L20.7 17.8 L17 16.5 L20.7 15.2 Z" fill="#bd93f9"/>
  <text x="34" y="20" class="mono" font-size="10" letter-spacing="1"><tspan fill="#c4b5fd">MAIN PROJECT PILLARS</tspan><tspan fill="#9489b8">&#160;&#160;//&#160;&#160;4 CORE ARCHITECTURES</tspan></text>

  <!-- right-aligned meta label + pulsing status indicator anchored at right edge (zero font-width collision) -->
  <text x="848" y="20" text-anchor="end" class="mono" font-size="10" fill="#9489b8" letter-spacing="0.8">zengllq://stack.matrix</text>
  <circle cx="859" cy="16.5" r="2.8" fill="#bd93f9">
    <animate attributeName="opacity" values="1;0.4;1" keyTimes="0;0.5;1" dur="2.6s" repeatCount="indefinite"/>
  </circle>

  <!-- ==================== 01: BLOCKCHAIN ==================== -->
  <g>
    <rect x="16.5" y="46.5" width="202" height="85" rx="6" fill="#1b1630" stroke="#322b4f" stroke-width="1">
      <animate attributeName="stroke" values="#bd93f9;#bd93f9;#322b4f;#322b4f;#bd93f9" keyTimes="0;0.21;0.25;0.96;1" dur="12s" repeatCount="indefinite"/>
    </rect>
    <!-- vector ledger chain icon -->
    <g fill="none" stroke="#bd93f9" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="29.5" y="56.5" width="6" height="6" rx="1"/>
      <rect x="38.5" y="59.5" width="6" height="6" rx="1"/>
      <line x1="35.5" y1="60.5" x2="38.5" y2="61.5"/>
    </g>
    <text x="50" y="64" class="mono" font-size="9" fill="#9489b8" letter-spacing="1">01 // DOMAIN</text>
    <text x="29" y="83" font-size="13" font-weight="600" fill="#faf5ff">Blockchain</text>
    <text x="29" y="100" class="mono" font-size="9" fill="#c4b5fd">Smart Contracts · ZK · Web3</text>
    <text x="29" y="114" class="mono" font-size="8.5" fill="#9489b8">Solidity · Rust · Move · Cairo</text>
    <rect x="29" y="122" width="177" height="3" rx="1.5" fill="#2b2447"/>
    <rect x="29" y="122" width="24" height="3" rx="1.5" fill="#bd93f9" fill-opacity="0.85">
      <animate attributeName="width" values="24;177;177;24;24" keyTimes="0;0.20;0.25;0.26;1" dur="12s" repeatCount="indefinite"/>
      <animate attributeName="fill-opacity" values="0.85;0.85;0;0;0.85" keyTimes="0;0.21;0.25;0.96;1" dur="12s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- ==================== 02: CYBERSECURITY ==================== -->
  <g>
    <rect x="231.5" y="46.5" width="202" height="85" rx="6" fill="#1b1630" stroke="#322b4f" stroke-width="1">
      <animate attributeName="stroke" values="#322b4f;#322b4f;#bd93f9;#bd93f9;#322b4f;#322b4f" keyTimes="0;0.21;0.25;0.46;0.50;1" dur="12s" repeatCount="indefinite"/>
    </rect>
    <!-- vector shield icon -->
    <g fill="none" stroke="#bd93f9" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M249.5 55.5 L254.5 57.3 L254.5 61.2 C254.5 64.1 252.2 66.1 249.5 67.2 C246.8 66.1 244.5 64.1 244.5 61.2 L244.5 57.3 Z"/>
      <circle cx="249.5" cy="61" r="1.1" fill="#bd93f9" stroke="none"/>
    </g>
    <text x="261" y="64" class="mono" font-size="9" fill="#9489b8" letter-spacing="1">02 // DOMAIN</text>
    <text x="244" y="83" font-size="13" font-weight="600" fill="#faf5ff">Cybersecurity</text>
    <text x="244" y="100" class="mono" font-size="9" fill="#c4b5fd">Systems · SecOps · Reversing</text>
    <text x="244" y="114" class="mono" font-size="8.5" fill="#9489b8">ASM · C++ · Rust · Nim · Bash</text>
    <rect x="244" y="122" width="177" height="3" rx="1.5" fill="#2b2447"/>
    <rect x="244" y="122" width="24" height="3" rx="1.5" fill="#bd93f9" fill-opacity="0">
      <animate attributeName="width" values="24;24;177;177;24;24" keyTimes="0;0.25;0.45;0.50;0.51;1" dur="12s" repeatCount="indefinite"/>
      <animate attributeName="fill-opacity" values="0;0;0.85;0.85;0;0" keyTimes="0;0.21;0.25;0.46;0.50;1" dur="12s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- ==================== 03: BACKEND ==================== -->
  <g>
    <rect x="446.5" y="46.5" width="202" height="85" rx="6" fill="#1b1630" stroke="#322b4f" stroke-width="1">
      <animate attributeName="stroke" values="#322b4f;#322b4f;#bd93f9;#bd93f9;#322b4f;#322b4f" keyTimes="0;0.46;0.50;0.71;0.75;1" dur="12s" repeatCount="indefinite"/>
    </rect>
    <!-- vector server stack icon -->
    <g fill="none" stroke="#bd93f9" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="459.5" y="56.5" width="11" height="4" rx="1"/>
      <rect x="459.5" y="62.5" width="11" height="4" rx="1"/>
      <circle cx="462" cy="58.5" r="0.8" fill="#bd93f9" stroke="none"/>
      <circle cx="462" cy="64.5" r="0.8" fill="#bd93f9" stroke="none"/>
    </g>
    <text x="477" y="64" class="mono" font-size="9" fill="#9489b8" letter-spacing="1">03 // DOMAIN</text>
    <text x="459" y="83" font-size="13" font-weight="600" fill="#faf5ff">Backend</text>
    <text x="459" y="100" class="mono" font-size="9" fill="#c4b5fd">Distributed · Cloud · Data</text>
    <text x="459" y="114" class="mono" font-size="8.5" fill="#9489b8">Go · Elixir · Ballerina · SQL</text>
    <rect x="459" y="122" width="177" height="3" rx="1.5" fill="#2b2447"/>
    <rect x="459" y="122" width="24" height="3" rx="1.5" fill="#bd93f9" fill-opacity="0">
      <animate attributeName="width" values="24;24;177;177;24;24" keyTimes="0;0.50;0.70;0.75;0.76;1" dur="12s" repeatCount="indefinite"/>
      <animate attributeName="fill-opacity" values="0;0;0.85;0.85;0;0" keyTimes="0;0.46;0.50;0.71;0.75;1" dur="12s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- ==================== 04: AI & MACHINE LEARNING ==================== -->
  <g>
    <rect x="661.5" y="46.5" width="202" height="85" rx="6" fill="#1b1630" stroke="#322b4f" stroke-width="1">
      <animate attributeName="stroke" values="#322b4f;#322b4f;#bd93f9;#bd93f9;#322b4f" keyTimes="0;0.71;0.75;0.96;1" dur="12s" repeatCount="indefinite"/>
    </rect>
    <!-- vector neural graph icon (widely spaced nodes for mobile downscaling clarity) -->
    <g fill="none" stroke="#bd93f9" stroke-width="1.1" stroke-linecap="round">
      <line x1="675.5" y1="56.5" x2="683.5" y2="58"/>
      <line x1="675.5" y1="65" x2="683.5" y2="58"/>
      <line x1="675.5" y1="56.5" x2="683.5" y2="63.5"/>
      <line x1="675.5" y1="65" x2="683.5" y2="63.5"/>
      <circle cx="675.5" cy="56.5" r="1.4" fill="#bd93f9" stroke="none"/>
      <circle cx="675.5" cy="65" r="1.4" fill="#bd93f9" stroke="none"/>
      <circle cx="683.5" cy="58" r="1.4" fill="#c4b5fd" stroke="none"/>
      <circle cx="683.5" cy="63.5" r="1.4" fill="#c4b5fd" stroke="none"/>
    </g>
    <text x="691" y="64" class="mono" font-size="9" fill="#9489b8" letter-spacing="1">04 // DOMAIN</text>
    <text x="674" y="83" font-size="13" font-weight="600" fill="#faf5ff">AI &amp; Machine Learning</text>
    <text x="674" y="100" class="mono" font-size="9" fill="#c4b5fd">GPU Compute · Symbolic · ML</text>
    <text x="674" y="114" class="mono" font-size="8.5" fill="#9489b8">Python · Mojo · CUDA · Julia</text>
    <rect x="674" y="122" width="177" height="3" rx="1.5" fill="#2b2447"/>
    <rect x="674" y="122" width="24" height="3" rx="1.5" fill="#bd93f9" fill-opacity="0">
      <animate attributeName="width" values="24;24;177;177;24" keyTimes="0;0.75;0.94;0.99;1" dur="12s" repeatCount="indefinite"/>
      <animate attributeName="fill-opacity" values="0;0;0.85;0.85;0;0" keyTimes="0;0.71;0.75;0.95;0.99;1" dur="12s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
